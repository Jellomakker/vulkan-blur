plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/releases/' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "maven.modrinth:vulkanmod:${project.vulkanmod_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
    localRuntime "org.lwjgl:lwjgl-vulkan:3.3.3"
    localRuntime "org.lwjgl:lwjgl-vma:3.3.3"
    localRuntime "org.lwjgl:lwjgl-vma:3.3.3:natives-windows"
    localRuntime "org.lwjgl:lwjgl-shaderc:3.3.3"
    localRuntime "org.lwjgl:lwjgl-shaderc:3.3.3:natives-windows"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

